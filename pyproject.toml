[project]

name = "spatialgeometry"

description = "A Shape and Geometry Description Package"

version = "1.1.0"

authors = [
    { name = "Jesse Haviland", email = "j.haviland@qut.edu.au" },
    { name = "Peter Corke", email = "rvc@petercorke.com" },
]

dependencies = ["numpy>=2,<3", "spatialmath-python>=1.1.15"]


license = { file = "LICENSE" }

readme = "README.md"

requires-python = ">=3.10"

keywords = [
    "python",
    "robotics",
    "robotics-toolbox",
    "kinematics",
    "dynamics",
    "motion-planning",
    "trajectory-generation",
    "jacobian",
    "hessian",
    "control",
    "simulation",
    "robot-manipulator",
    "mobile-robot",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    # Indicate who your project is intended for
    "Intended Audience :: Developers",
    # Pick your license as you wish (should match "license" above)
    "License :: OSI Approved :: MIT License",
    # Specify the Python versions you support here.
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]


[project.urls]
homepage = "https://github.com/jhavl/spatialgeometry"
documentation = "https://jhavl.github.io/spatialgeometry/"
repository = "https://github.com/jhavl/spatialgeometry"


[project.optional-dependencies]

collision = ["pybullet"]

dev = [
    "black",
    "mypy",
    "pytest-timeout",
    "roboticstoolbox-python @ git+https://github.com/gaurishg/robotics-toolbox-python.git",
    "ruff",
    "swift-sim",
    "pytest",
    "pytest-cov",
    "flake8",
    "pyyaml",
]

docs = ["sphinx", "sphinx_rtd_theme", "sphinx-autorun"]

[dependency-groups]

dev-env = [
    "black",
    "mypy",
    "pytest-timeout",
    "roboticstoolbox-python @ git+https://github.com/gaurishg/robotics-toolbox-python.git",
    "ruff",
    "swift-sim",
    "pytest",
    "pytest-cov",
    "flake8",
    "pyyaml",
]


[build-system]

requires = [
    "setuptools",
    "numpy>=2,<3",
]
build-backend = "setuptools.build_meta"


[tool.setuptools]

packages = ["spatialgeometry", "spatialgeometry.geom", "spatialgeometry.tools"]


[tool.uv.sources]

spatialgeometry = { workspace = true }

[tool.uv.workspace]

members = ["."]

[[tool.uv.dependency-metadata]]

name = "roboticstoolbox-python"
version = "1.1.1"
requires-dist = [
    "numpy>=2.0.0",
    "spatialmath-python>=1.1.5",
    "spatialgeometry>=1.1.0",
    "pgraph-python",
    "scipy",
    "matplotlib",
    "ansitable",
    "swift-sim>=1.0.0",
    "rtb-data",
    "progress",
    "typing_extensions",
]


[tool.black]

line-length = 88
target_version = ['py310']
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | \.github
    | _build
    | buck-out
    | build
    | dist
    | docs
  )/
)
'''


[tool.flake8]

max-line-length = 88
extend-ignore = 'E203'


[tool.ruff]

line-length = 88
target-version = "py310"

[tool.ruff.lint]

select = ["E", "F", "I", "UP"]


[tool.mypy]

python_version = "3.10"
files = ["spatialgeometry"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]

module = [
    "roboticstoolbox",
    "roboticstoolbox.*",
    "pybullet",
    "spatialmath",
    "spatialmath.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]

module = ["spatialgeometry.tools.*"]
ignore_errors = true


[tool.cibuildwheel]

# Will cause the wheel to be installed with `pip install <wheel_file>[dev,collision]`
# test-extras = ["dev", "collision"]
# test-requires = "pytest"
# test-command = "pytest {project}/tests"

manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

# Build CPython 3.10 - 3.12
build = ["cp310-*", "cp311-*", "cp312-*"]

# Disable building musllinux wheels on all platforms
skip = ["pp*", "*musllinux*"]


[tool.cibuildwheel.macos]

# Build `x86_64` and `arm64` wheels on an Intel runner.
# Note that the `arm64` wheel cannot be tested in this configuration.
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.linux]

# On an Linux Intel runner with qemu installed, build Intel and ARM wheels
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.windows]

# On an Windows Intel runner build wheels
archs = ["AMD64", "x86"]
